name: SIL4 CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sil4/**'
      - '.github/workflows/sil4-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sil4/**'
      - '.github/workflows/sil4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sil4-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck

      - name: Run SIL4 Verification
        run: bash sil4/tools/run_ci_verification.sh

      - name: Render PR Annotation
        if: always() && github.event_name == 'pull_request'
        run: bash sil4/tools/render_pr_annotation.sh

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f /tmp/rsrx-ci-logs/summary.md ]; then
            cat /tmp/rsrx-ci-logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SIL4 CI summary not found" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f /tmp/rsrx-ci-logs/pr_annotation.md ]; then
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/rsrx-ci-logs/pr_annotation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rsrx-sil4-pr-annotation -->';
            const path = '/tmp/rsrx-ci-logs/pr_annotation.md';
            if (!fs.existsSync(path)) {
              core.info('PR annotation markdown not found; skipping comment publication');
              return;
            }
            const body = `${marker}\n` + fs.readFileSync(path, 'utf8');
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated PR annotation comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              core.info(`Created PR annotation comment ${created.data.id}`);
            }

      - name: Upload SIL4 CI Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil4-ci-logs
          path: |
            /tmp/rsrx-ci-logs/configure.log
            /tmp/rsrx-ci-logs/build.log
            /tmp/rsrx-ci-logs/tests.log
            /tmp/rsrx-ci-logs/cppcheck.log
            /tmp/rsrx-ci-logs/summary.md
            /tmp/rsrx-ci-logs/summary.env
            /tmp/rsrx-ci-logs/pr_annotation.md
            /tmp/rsrx-ci-logs/pr_annotation.env
          if-no-files-found: error
